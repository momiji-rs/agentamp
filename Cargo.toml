[package]
name = "agentamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A tiny, agent-native terminal music player for Spotify, YouTube and local files"

[features]
# Developer mode: an overlay in the window that switches the spectrum's
# choices while it plays. Release builds leave it out.
dev = []

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
log = "0.4"
# No colours, regexes or timestamps parsing: the log is a plain file.
env_logger = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
# Spotify: the session, playback, sign-in and catalogue metadata. Playback
# needs Premium. No audio backend: AgentAmp sends librespot's sound to the
# device itself, through rodio.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8", default-features = false }
# The sound out, and the decoder for local files and YouTube audio: the
# same symphonia librespot decodes with, so there is no second decoder.
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3", "flac", "mp4", "vorbis", "wav"] }
# Title, artist, album and duration of local files.
lofty = "0.25"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
# Decoding covers: Spotify's and YouTube's are JPEG, embedded ones also PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# librespot's HTTP client fetches covers; these are its request types.
http = "1"
bytes = "1"
# Reading Spotify's web player code for its current query hashes, as a
# desktop browser: librespot's client sends its own user agent, which gets
# the mobile web player. The same client and TLS librespot is built on.
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring"] }
http-body-util = "0.1"
# Real covers in terminals with kitty graphics, Sixel or iTerm2 images;
# elsewhere the window draws its own half blocks. Without chafa or the
# image crate's other formats.
ratatui-image = { version = "=12.0.0-rc.0", default-features = false, features = ["crossterm"] }
# `agentamp mcp`: the official Model Context Protocol SDK, as a server on
# stdio only. It follows each revision of the spec (2026-07-28 dropped the
# `initialize` handshake) and still answers clients of the older ones.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
# The tools' input and output schemas, derived from the types they carry.
schemars = "1"
# The same width tables ratatui lays out with, to place the cursor in --frame output.
unicode-width = "0.2"

# To notice the terminal closing: crossterm's reader spins at full CPU on a
# terminal that hung up without a signal (crossterm-rs/crossterm#793).
# Already built for crossterm and mio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
