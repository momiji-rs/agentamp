name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # rodio's sound output goes through ALSA on Linux.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      # --locked: Cargo.lock pins vergen 9.0.6 for librespot-core's build script.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy, developer mode
        run: cargo clippy --locked --all-targets --features dev -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test, developer mode
        run: cargo test --locked --features dev --bin agentamp
